<!doctype html>
<html lang="en" data-theme="light" data-theme-pending>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
    <meta http-equiv="Content-Security-Policy" content="{{csp}}">
    <meta name="referrer" content="no-referrer">
    <meta name="color-scheme" content="light dark">
    <meta name="theme-color" content="#005fb8">
    <meta name="description" content="Send files between devices on the same Wi-Fi, directly, with no server.">
    <meta name="ether-build" content="{{version}}">
    <title>Ether</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
    <link rel="stylesheet" href="{{styles}}">
    <script type="module" src="{{script}}"></script>
</head>
<body>
    <a class="skip-link" href="#main">Skip to content</a>
    <div class="app" data-role="app">
        <main id="main" class="app-main" tabindex="-1">
            <p class="boot-message" data-role="boot">Loading Ether…</p>
        </main>
    </div>
    <noscript>
        <p class="boot-message">Ether needs JavaScript to send files.</p>
    </noscript>
</body>
</html>
